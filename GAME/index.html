<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四间房 · 完整版 v7.1</title>
<style>
:root{--paper:#f3f0e8;--card:#fffdf8;--line:#d9d4c6;--ink:#20201e;--muted:#6b685f;--gold:#8a6a2c;--goldbg:#f6ecd4;--green:#2f6b46}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#12110f;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#stage{display:flex;height:100vh;height:100dvh;width:100vw;position:relative}
html,body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#stage,#panel,#scene{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

/* ---------- 场景：底图与遮挡块共用同一百分比坐标系 ---------- */
#scene{position:relative;flex:1;min-width:0;overflow:hidden;background:#12110f}
#sceneBg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;filter:saturate(80%) brightness(.92);transition:filter 1.1s}
#scene.dim #sceneBg{filter:saturate(62%) brightness(.55)}
/* 暗角压在遮挡块之上：底图与遮挡块一起被压暗，边界才不会露出来 */
#vignette{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 45% 45%,rgba(0,0,0,0) 38%,rgba(0,0,0,.58) 100%)}
#roomTag{position:absolute;left:18px;top:15px;z-index:9;color:#efe7d4;font-size:13px;letter-spacing:.08em;text-shadow:0 2px 8px #000;pointer-events:none}
#roomTag small{display:block;font-size:11px;opacity:.7;letter-spacing:.02em;margin-top:3px}
#log{position:absolute;left:18px;bottom:14px;z-index:9;max-width:62%;color:#f2ece0;font-size:14px;line-height:1.85;text-shadow:0 2px 10px #000;pointer-events:none}
#log p{margin:0}
#log p.dim{opacity:.6;font-size:12.5px}

#caches,#covers,#slots{position:absolute;inset:0;pointer-events:none}
/* 与 #sceneBg 的 filter 过渡完全同步，换房 / 调暗时遮挡块不会短暂跳色 */
#caches{z-index:2}#covers{z-index:4;transition:filter 1.1s}#slots{z-index:7}
.cache,.cover,.pslot,.hangTarget{position:absolute;pointer-events:auto}
.cavity{position:absolute;inset:14%;border-radius:12px;background:radial-gradient(ellipse at center,rgba(12,11,9,.68) 0%,rgba(18,16,13,.38) 48%,rgba(18,16,13,0) 80%);transition:opacity .55s}
.cache.taken .cavity{opacity:0}
.cover.gone{opacity:0 !important;pointer-events:none}
.hiddenItem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;max-width:110px;max-height:78%;border:0;background:none;padding:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s,transform .25s}
.hiddenItem.visible{opacity:.94;pointer-events:auto}
.hiddenItem:hover{transform:translate(-50%,-50%) scale(1.07)}
.hiddenItem img{display:block;width:100%;height:auto;max-height:78%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.85)) brightness(.88)}
.hiddenItem.paper img{border:2px solid #2b2721;border-radius:2px;box-shadow:0 6px 15px rgba(0,0,0,.8);background:#3a352d}
.hiddenItem.picked{display:none}

/* 写实遮挡块：从底图裁出，静止时与背景像素级重合；无文字标签 */
.cover{cursor:grab;transition:transform .5s cubic-bezier(.22,.7,.3,1),opacity .5s,filter .3s;filter:brightness(1)}
.cover:hover{filter:brightness(1.055)}
.cover img{display:block;width:100%;height:100%;object-fit:fill}
/* 第四间房：关掉鼠标扫过的高亮，遮挡块与背景完全同色 */
#scene.blend .cover:hover{filter:none}
/* 第四间房：只留中心一小块可拖，和图三柜角胶带同一强度 */
.cover .hit{display:none;position:absolute;pointer-events:auto}
#scene.blend .cover{pointer-events:none}
#scene.blend .cover .hit{display:block;left:31%;top:33%;width:38%;height:34%;border-radius:3px}
.cover.moved{transform:translate(-36%,-15%) rotate(-6deg);opacity:.17;pointer-events:none;cursor:default}
.cover.tugged{transform:translate(4%,0) scaleX(.9);opacity:.9}
.cover.shake{animation:shake .25s}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-4px}75%{margin-left:4px}}
.hangTarget{cursor:pointer;border:1px dashed rgba(230,214,175,0);border-radius:6px;transition:border-color .3s,background .3s;z-index:6}
.hangTarget:hover{border-color:rgba(230,214,175,.5);background:rgba(230,214,175,.07)}
.hangTarget.armed{border-color:rgba(230,214,175,.75);background:rgba(230,214,175,.12)}

.pslot{transform:translate(-50%,-50%);width:92px;min-height:60px;border:1.5px dashed rgba(230,214,175,.55);background:rgba(16,15,12,.55);color:#e5d8b9;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:5px;cursor:pointer;padding:5px;gap:3px}
.pslot .sn{font-size:10px;opacity:.6}
.pslot .sv{font-size:11px;line-height:1.35}
.pslot.filled{border-style:solid;border-color:var(--gold);background:rgba(138,106,44,.32)}
.pslot.shake{animation:shake .25s}
#doorSpot{position:absolute;left:66%;top:22%;z-index:8;transform:translate(-50%,-50%);width:64px;height:100px;border:2px solid rgba(230,214,175,.85);border-radius:5px;background:rgba(20,18,14,.42);box-shadow:0 0 26px rgba(226,198,132,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
#doorSpot::before{content:'';width:9px;height:9px;border-radius:50%;background:#d8bf8a;box-shadow:0 0 14px 4px rgba(216,191,138,.65)}
#doorSpot:hover{background:rgba(90,74,44,.6)}

/* ---------- 右侧面板 ---------- */
#panel{width:344px;flex:none;background:var(--paper);border-left:1px solid #cfc9ba;overflow-y:scroll;overflow-x:hidden;padding:14px 20px 26px 14px;z-index:10;scrollbar-width:none}
#panel::-webkit-scrollbar{width:0;height:0}
#panel h1{font-size:15px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;justify-content:space-between}
/* 自绘侧边移动条：不依赖原生滚动条渲染，轨道可见、滑块可拖 */
#panelBar{position:absolute;right:0;top:0;bottom:0;width:13px;z-index:12;background:linear-gradient(90deg,#efeade,#e7e0cf);border-left:1px solid #d8d0ba;cursor:pointer}
#panelThumb{position:absolute;left:2px;right:2px;top:0;height:56px;min-height:48px;background:#8a7647;border:1px solid #6c5933;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);cursor:grab}
#panelThumb:hover{background:#6f5c33}
#panelThumb.grabbing{cursor:grabbing;background:#7a683d}
.jumps{display:flex;gap:4px;font-weight:400}
#panel .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.tiny{font-size:9.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.sec{margin:0 0 13px}
.sec>h2{font-size:11.5px;font-weight:600;letter-spacing:.07em;color:#575349;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1/1;min-height:42px;border:1px solid var(--line);border-radius:4px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;overflow:hidden}
.cell.empty{border-style:dashed;background:transparent;cursor:default}
.cell img{width:76%;height:76%;object-fit:contain}
.cell .nm{font-size:9px;line-height:1.15;color:#4a4740;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.cell.done::after{content:'✓';position:absolute;right:3px;top:1px;font-size:11px;color:var(--green)}
.cell.shake{animation:shake .25s}
#reader{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:9px 10px;font-size:12.5px;line-height:1.75;min-height:62px}
#reader .rt{font-weight:600;margin-bottom:3px}
#reader .r2{color:#7a3b30;border-top:1px dashed var(--line);padding-top:5px;margin-top:5px}
#reader .unread{color:var(--muted);font-size:11.5px}
#clueRow{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.chip{font-size:10.5px;background:#fff;border:1px solid #d8cfb6;color:#6a5426;padding:2px 6px;border-radius:11px;cursor:pointer}
.chip.sel{outline:2px solid var(--gold)}
.qslots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.qslot{aspect-ratio:1/1;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#a8a296;font-size:14px;background:rgba(255,255,255,.35);font-size:10px;text-align:center;padding:2px}
.qslot.on{background:var(--goldbg);border-color:#d9c391;color:var(--gold);line-height:1.3}
.task{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:7px 9px;font-size:11.5px;line-height:1.6;margin-bottom:6px}
.task.side{border-left-color:#5b6f8c}
.task.done{border-left-color:var(--green);opacity:.72}
.task .kind{font-size:9.5px;color:var(--gold);letter-spacing:.05em}
.task.side .kind{color:#5b6f8c}
.task .goal{font-size:10.5px;color:var(--muted);margin-top:2px}
.steps{display:flex;gap:4px;margin-top:5px}
.steps i{flex:1;height:4px;background:#ddd7c8;border-radius:2px}
.steps i.on{background:var(--gold)}
#boardEmpty{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.eviGroup{border:1px dashed #cfc6ac;border-radius:4px;padding:5px;margin-bottom:5px;background:rgba(255,255,255,.4)}
.eviGroup .eh{font-size:10px;color:var(--muted);margin-bottom:4px}
.eviSlots{display:flex;gap:4px}
.eviSlot{flex:1;height:34px;border:1px dashed #d5cdb8;border-radius:3px;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-size:9px;color:#a39b87;text-align:center;cursor:pointer;line-height:1.2;padding:2px}
.eviSlot.filled{border-style:solid;border-color:#b9a878;background:var(--goldbg);color:#6a5426}
.eviGroup.solved{border-color:var(--green)}
.eviHelp{font-size:10.5px;color:var(--muted);line-height:1.6;margin-bottom:7px}
.eviGroup .br{font-size:10.5px;color:#4b4335;margin-top:4px;line-height:1.6}
.eviGroup:hover{border-color:#b9a878}
.eviGroup.focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,148,72,.18)}
.eviGroup .eh{display:flex;align-items:flex-start;gap:4px;cursor:pointer}
.eviGroup .eh .ask{flex:1;font-size:11px;color:#4b4335;line-height:1.5}
.eviGroup.solved .eh .ask{color:var(--green)}
.eviGroup .eh .cnt{font-size:9.5px;color:var(--muted);white-space:nowrap}
.eviGroup .eh .mini{font-size:9px;border:1px solid #d8cfb6;background:#fffdf6;border-radius:3px;padding:0 4px;color:#6a5426;cursor:pointer}
.eviGroup .tip{font-size:10.5px;color:#6a5426;background:var(--goldbg);border-radius:3px;padding:4px 6px;margin-top:4px;line-height:1.5}
.jump{font-size:10px;border:1px solid #cfc4a6;background:#fffdf6;border-radius:4px;padding:2px 7px;color:#5c4a22;cursor:pointer}
.jump:hover{background:var(--goldbg)}
.clueGroup{display:flex;align-items:flex-start;gap:4px;margin-bottom:4px}
.clueGroup .ch{font-size:9px;color:var(--muted);white-space:nowrap;padding-top:3px;min-width:34px}
.clueGroup.now .ch{color:var(--gold)}
.clueGroup .cgs{display:flex;flex-wrap:wrap;gap:4px}
.readonly{font-size:10px;color:var(--muted);margin:0 0 4px}
.pslot .sv.empty-hint{color:#9d9584;font-size:9px}
#hintBox{font-size:11.5px;color:#6a5426;background:var(--goldbg);border-radius:4px;padding:6px 8px;min-height:28px}
.btn{width:100%;margin-top:6px;padding:6px;border:1px solid #cfc4a6;background:#fffdf6;border-radius:4px;color:#5c4a22;font-size:11.5px;cursor:pointer}
.btn:hover{background:var(--goldbg)}

/* ---------- 开场 / 过场 / 终局 ---------- */
#intro,#seq,#cinematic,#ending,#dark{position:fixed;inset:0;z-index:40}
#intro{background:#0b0a09;display:flex;align-items:center;justify-content:center;cursor:pointer}
#intro .dot{width:9px;height:9px;border-radius:50%;background:#c9b98f;box-shadow:0 0 22px 6px rgba(201,185,143,.35);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.25)}}
#seq{background:#000;z-index:38}
#seqImg{width:100%;height:100%;object-fit:cover;filter:contrast(1.15)}
#flash,#blackout{position:absolute;inset:0;opacity:0;pointer-events:none}
#flash{background:#fff}#blackout{background:#000;transition:opacity .35s}
#seqSub{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;color:#e6ddc9;font-size:21px;line-height:2.2;letter-spacing:.05em;white-space:pre-line;opacity:0;transition:opacity 1.1s;pointer-events:none;text-shadow:0 2px 20px #000}
#seqSub.show{opacity:.94}
#seqClick{position:absolute;left:0;right:0;bottom:13%;text-align:center;color:#c9b98f;font-size:12px;letter-spacing:.32em;opacity:0;transition:opacity 1s;pointer-events:none}
#seqClick.show{opacity:.9;animation:breathe 2.6s ease-in-out infinite}
#cinematic{background:#191814;z-index:36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#cineItem{font-size:11px;letter-spacing:.24em;color:#8d8779;min-height:18px;margin-bottom:22px}
#cineLine{font-size:25px;line-height:1.9;max-width:720px;min-height:80px;margin:0;padding:0 20px;color:#e9e3d5}
#ending{background:radial-gradient(ellipse at 50% 40%,#503f2b,#171410 76%);z-index:36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f0e6d2}
#endArt{display:flex;align-items:flex-end;justify-content:center;gap:24px;margin-bottom:26px;opacity:.7}
#endArt svg{width:60px;height:106px;fill:none;stroke:#d9c49b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#endLine{font-size:17px;min-height:56px;max-width:560px;margin:0 0 18px;line-height:1.9}
#btnHand{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid rgba(230,222,200,.4);background:rgba(30,27,22,.7);color:#f0e6d2;border-radius:6px;padding:9px 18px}
#btnHand:hover{background:rgba(80,66,44,.8)}
#dark{background:#0c0b09;color:#8b867a;z-index:37;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
#credits{margin-top:16px;font-size:12px;letter-spacing:.06em;color:#a89f8c}
@media(max-width:1000px) and (pointer:fine){#panel{width:290px}#log{font-size:12.5px;max-width:55%}}

/* ---------- 触屏拖动的跟随浮层 ---------- */
#touchGhost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);
  min-width:76px;max-width:140px;padding:5px 8px;border-radius:8px;border:1px solid #b9a878;
  background:rgba(255,253,246,.94);box-shadow:0 6px 20px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#4b4335;text-align:center}
#touchGhost img{width:50px;height:50px;object-fit:contain}

/* ---------- 手机竖屏：场景在上、面板在下，场景保持 3:2 不被拉扁 ---------- */
@media (orientation:portrait) and (max-width:820px){
 #stage{flex-direction:column}
 #scene{flex:none;width:100%;height:auto;aspect-ratio:3/2}
 #panel{width:100%;flex:1 1 auto;min-height:0;height:auto;border-left:0;border-top:2px solid #cfc9ba;
   padding:10px 12px calc(24px + env(safe-area-inset-bottom));
   overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#8a7647 transparent}
 #panel::-webkit-scrollbar{width:5px}
 #panel::-webkit-scrollbar-thumb{background:#8a7647;border-radius:3px}
 /* 竖屏改回原生触摸滚动，自绘移动条只留桌面使用 */
 #panelBar{display:none}
 #panel h1{font-size:16px}
 #panel .sub{font-size:12px;margin-bottom:10px}
 .sec{margin-bottom:15px}
 .sec>h2{font-size:12.5px;margin-bottom:8px}
 .grid{gap:6px}
 .cell{min-height:58px;border-radius:6px}
 .cell img{width:70%;height:70%}
 .cell .nm{font-size:11px}
 #reader{font-size:13.5px;line-height:1.7;min-height:70px;padding:11px 12px}
 #reader .r2,#reader .unread{font-size:12.5px}
 #clueRow{gap:6px}
 .chip{font-size:12.5px;padding:7px 11px;min-height:36px;display:inline-flex;align-items:center}
 .clueGroup .ch{font-size:11px;min-width:38px}
 .qslot{font-size:11px;min-height:46px}
 .task{font-size:13px;padding:9px 11px;line-height:1.65}
 .task .kind{font-size:11px}
 .task .goal,.readonly,.eviHelp,.eviGroup .br,.eviGroup .tip{font-size:11.5px}
 .eviGroup{padding:7px;margin-bottom:7px}
 .eviSlot{height:46px;font-size:11px}
 .eviGroup .eh .ask{font-size:12.5px}
 .eviGroup .eh .mini{min-height:32px;min-width:46px;font-size:11px}
 .jump{min-height:34px;font-size:11.5px;padding:5px 9px}
 .btn{min-height:46px;font-size:14px;margin-top:8px}
 #hintBox{font-size:12.5px;min-height:36px;line-height:1.5}
 .pslot{width:19vw;min-height:46px;font-size:10px;padding:3px;gap:2px}
 .pslot .sn,.pslot .sv,.pslot .sv.empty-hint{font-size:10px}
 #doorSpot{width:46px;height:72px}
 .hiddenItem{max-width:76px}
 #roomTag{left:10px;top:8px;font-size:12px}
 #roomTag small{font-size:10px}
 #log{left:8px;right:8px;bottom:6px;max-width:none;font-size:11px;line-height:1.5;
   padding:5px 7px;border-radius:4px;background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.3))}
 #log p.dim{font-size:10.5px}
 /* 第四房隐藏保留，但手机上把可拖命中区放大到手指能点中 */
 #scene.blend .cover .hit{left:25%;top:27%;width:50%;height:46%}
 #seqSub{font-size:18px;line-height:1.9;top:42%}
 #seqClick{bottom:calc(12% + env(safe-area-inset-bottom));font-size:13px}
 #cinematic{padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
 #cineItem{font-size:11px}
 #cineLine{font-size:19px;line-height:1.8;min-height:64px;padding:0 8px}
 #ending{padding:20px calc(16px + env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom))}
 #endArt{gap:14px;margin-bottom:18px}
 #endArt svg{width:44px;height:78px}
 #endArt svg:last-child{width:32px;height:58px}
 #endLine{font-size:16px;line-height:1.8;padding:0 10px}
 #btnHand{font-size:15px;padding:12px 24px;min-height:48px}
 #credits{font-size:12px;padding:0 16px;text-align:center}
}

/* ---------- 手机横屏：保持左右分栏，压缩面板与字号 ---------- */
@media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
 #panel{width:46%;max-width:330px;padding:8px 12px}
 #panelBar{width:8px}#panelThumb{left:1px;right:1px;min-height:40px}
 #panel h1{font-size:14px}
 .cell{min-height:46px}.cell .nm{font-size:10px}
 #reader{font-size:12.5px;min-height:56px}
 .btn{min-height:40px}
 .chip{font-size:11.5px;padding:4px 8px}
 .eviSlot{height:38px}
 #roomTag{font-size:11px;top:8px;left:10px}
 #log{font-size:11.5px;bottom:8px;left:10px}
 #seqSub{font-size:19px;top:44%}
 #seqClick{bottom:10%}
 #cineLine{font-size:20px;min-height:60px}
 #endArt svg{width:44px;height:78px}
 #endArt svg:last-child{width:30px;height:54px}
}
</style>
</head>
<body>

<div id="intro" title="点击开始"><div class="dot"></div></div>

<div id="seq" hidden>
  <img id="seqImg" src="assets/intro/crash.png" alt="">
  <div id="flash"></div><div id="blackout"></div>
  <div id="seqSub"></div>
  <div id="seqClick">点 击 进 入</div>
</div>

<div id="stage">
  <div id="scene">
    <img id="sceneBg" src="assets/rooms/room1.png" alt="">
    <div id="vignette"></div>
    <div id="roomTag"></div>
    <div id="caches"></div>
    <div id="slots"></div>
    <div id="covers"></div>
    <div id="doorSpot" hidden title="下一间"></div>
    <div id="log"></div>

/* ---------- 右侧面板自绘滚动条：轨道常显、滑块可拖、与 panel.scrollTop 双向同步 ---------- */
function syncBar(){
 var p=el('panel'),bar=el('panelBar'),th=el('panelThumb');
 if(!p||!bar||!th)return;
 var vh=p.clientHeight,sh=p.scrollHeight;
 var h=Math.max(48,Math.round(vh*Math.min(1,vh/sh)));
 var maxTop=Math.max(0,vh-h),maxScroll=Math.max(0,sh-vh);
 th.style.height=h+'px';
 th.style.top=Math.round(maxScroll>0?(p.scrollTop/maxScroll)*maxTop:0)+'px';
 th.style.opacity=maxScroll>4?'1':'.28';
}
el('panel').addEventListener('scroll',syncBar);
window.addEventListener('resize',syncBar);
(function(){
 var p=el('panel'),bar=el('panelBar'),th=el('panelThumb'),dragging=false,sy=0,ss=0;
 bar.addEventListener('pointerdown',function(e){
  var r=bar.getBoundingClientRect(),h=th.getBoundingClientRect().height;
  var maxScroll=p.scrollHeight-p.clientHeight,maxTop=Math.max(1,r.height-h);
  if(e.target===th){dragging=true;sy=e.clientY;ss=p.scrollTop;th.classList.add('grabbing');
   try{th.setPointerCapture(e.pointerId);}catch(err){}}
  else p.scrollTop=Math.max(0,Math.min(1,(e.clientY-r.top-h/2)/maxTop))*maxScroll;
  e.preventDefault();
 });
 th.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var r=bar.getBoundingClientRect(),h=th.getBoundingClientRect().height;
  var maxScroll=p.scrollHeight-p.clientHeight,maxTop=Math.max(1,r.height-h);
  p.scrollTop=ss+(e.clientY-sy)/maxTop*maxScroll;syncBar();
 });
 function end(){dragging=false;th.classList.remove('grabbing');}
 th.addEventListener('pointerup',end);th.addEventListener('pointercancel',end);
})();

 if(S.opened[id]){if(!S.found[c.holds])log('下面的东西还没拿。',true);return;}
 S.opened[id]=true;
 node.classList.add('moved');

 if(!coverUnlock(c)){shake(node);return;}
 S.found[id]=true;S.reader=id;S.selected=null;
 if(MAIN[id]&&S.mainOrder.indexOf(id)<0)S.mainOrder.push(id);

/* v7：一件主道具要凑齐 2–3 样（辅助道具 + 已找回的主道具），必要时还得先把光调暗 */
function identify(src,mid,node){
 var m=MAIN[mid],rec=IDENT[mid];
 if(!m||!S.found[mid]||S.l2[mid]||!rec){if(mid==='R4_FAMILY')log('这张照片要挂回墙上，才看得清。',true);return fail(node);}
 if(!S.found[src]){log('这一样还没找到。',true);return fail(node);}
 if(rec.need.indexOf(src)<0){
  log(TOOL[src]?itemName(src)+'和这一件凑不上。':itemName(src)+'摆不到这一件旁边。',true);
  return fail(node);
 }
 if(rec.env==='dim'&&!S.dim){log('屋里太亮了。先把能挡光的东西拉上。',true);return fail(node);}
 var used=S.ident[mid]||(S.ident[mid]=[]);
 if(used.indexOf(src)>=0){log('这一样已经用过了。',true);return fail(node);}
 used.push(src);S.reader=mid;S.selected=null;S.hintCursor=0;
 if(used.length<rec.need.length){
  log(itemName(src)+'凑上去了。鉴定 '+used.length+'/'+rec.need.length+'，还差 '+(rec.need.length-used.length)+' 样。',true);
  Sound.tone(392,'sine',.12,.05,0);renderPanel();return true;
 }
 S.l2[mid]=true;S.clues.push(m.clue);S.roomClues.push(m.clue);
 log('几样东西凑到一起，才看清。',true);
 var keyTool=null;rec.need.forEach(function(x){if(TOOL[x])keyTool=x;});
 if(keyTool)log(TOOL[keyTool].result,true);
 log(m.l2);
 Sound.tone(523.25,'sine',.2,.08,0);Sound.tone(659.25,'sine',.26,.06,.14);
 renderPanel();updateSlots();return true;
}
function putSlot(src,sid,node){
 var p=PUZZLE[S.room+1];
 if(!allL2()){log('先把这间房的东西都看清。',true);return fail(node);}
 if(S.placed[sid]){log('这个槽已经放过了。',true);return fail(node);}
 if(TOOL[src]){log('工具不放进这里。',true);return fail(node);}
 if(p.accept==='main'&&!MAIN[src]){log('这一间要放的是主道具，不是线索卡。',true);return fail(node);}
 if(p.accept==='clue'&&S.clues.indexOf(src)<0){log('这一间要放的是线索卡，不是道具。',true);return fail(node);}
 if(p.answer[sid]!==src){log('这张卡不该放在这里。再看看顺序。',true);return fail(node);}
 S.placed[sid]=src;S.selected=null;
 if(puzzleDone()){
  if(S.room<=2){S.doorDone=true;log('四样东西都回到了原来的位置。');}
  else{S.lock4=true;log('锁开了。');}
 }
 renderPanel();updateSlots();return true;
}
function putEvidence(src,gi,k,node){
 var g=GROUPS[gi];if(!g)return fail(node);
 var arr=S.evidence[gi]||(S.evidence[gi]=[]);
 if(S.solved[gi]){log('这一组已经齐了。点开还能再看一遍。',true);return fail(node);}
 if(!MAIN[src]||!S.found[src]){log('这里只放找回来的东西，工具不算。',true);return fail(node);}
 if(arr.indexOf(src)>=0){log('这件已经放过了。',true);return fail(node);}
 if(k>=g.ids.length){log('这一组只要'+g.ids.length+'件。',true);return fail(node);}
 if(g.ids.indexOf(src)<0){
  var other=GROUPS.some(function(x){return x!==g&&x.ids.indexOf(src)>=0;});
  if(other)log('这件说的是「'+MOTIF[src]+'」，不是这一组。',true);
  else log('这件和这四组都对不上。'+(NONMEMBER[src]||'它不是这里的。'),true);
  return fail(node);
 }
 if(arr[k]){var free=-1;for(var i=0;i<g.ids.length;i++)if(!arr[i]){free=i;break;}
  if(free<0){log('这一组已经齐了。点开还能再看一遍。',true);return fail(node);}k=free;}
 arr[k]=src;S.eviFocus=gi;S.selected=null;
 if(g.ids.every(function(id){return arr.indexOf(id)>=0;})){
  S.solved[gi]=true;log('这一组对上了。',true);
  Sound.tone(523.25,'sine',.18,.09,0);Sound.tone(659.25,'sine',.22,.07,.13);
  log(g.text[0]);
 }else log('归档了一件。这件讲的是「'+MOTIF[src]+'」。',true);
 renderPanel();return true;
}
function hangPhoto(src,node){
 if(src!=='R4_FAMILY'||!S.found.R4_FAMILY||S.hung)return fail(node);
 S.hung=true;S.selected=null;
 S.l2.R4_FAMILY=true;S.clues.push('C4_THATDAY');S.roomClues.push('C4_THATDAY');S.reader='R4_FAMILY';

function apply(src,target){
 if(!src||!target)return false;
 if(target.dataset.cell!==undefined)return identify(src,target.dataset.cell,target);
 if(target.dataset.slot)return putSlot(src,target.dataset.slot,target);
 if(target.dataset.eviDrop!==undefined){
  var g=parseInt(target.dataset.eviDrop,10),arr=S.evidence[g]||[],free=0;
  while(free<GROUPS[g].ids.length&&arr[free])free++;
  return putEvidence(src,g,free,target);
 }
 if(target.dataset.evi){var q=target.dataset.evi.split('_');return putEvidence(src,parseInt(q[0],10),parseInt(q[1],10),target);}
 if(target.dataset.hang)return hangPhoto(src,target);
 return false;
}

  var target=hit(x,y);
  if(target&&target!==node){apply(src,target);S.selected=null;renderPanel();}
 },{passive:false});
 document.addEventListener('touchcancel',function(){if(T.on)clean();},{passive:true});
 document.addEventListener('click',function(e){
  if(S.suppressClick){S.suppressClick=false;e.preventDefault();e.stopPropagation();}
 },true);
})();

el('btnHint').addEventListener('click',function(){
 var mid=S.selected||S.reader;
 if(mid&&MAIN[mid]&&IDENT[mid]&&!S.l2[mid]){
  if(IDENT[mid].env==='dim'&&!S.dim){log('先把能挡光的东西拉上，屋里得暗一点。',true);}
  else{
   var miss=identMissing(mid);
   if(miss.length){var k=(S.hintCursor||0)%miss.length;S.hintCursor=k+1;
    log('这一件还差一样：'+itemName(miss[k])+'。'+(IDENT[mid].why||''),true);}
  }
 }else if(S.eviFocus!==null&&GROUPS[S.eviFocus]&&!S.eviTip[S.eviFocus]){
  var g=parseInt(S.eviFocus,10);S.eviTip[g]=true;log('这一组的一句话：'+GROUPS[g].tip,true);
 }else S.hintLevel=S.hintLevel%3+1;
 renderPanel();
});
el('btnAudio').addEventListener('click',function(){S.sound=!S.sound;Sound.setEnabled(S.sound);renderPanel();});

function nextRoom(){
 S.room++;S.opened={};S.dim=false;S.placed={};S.doorDone=false;S.lock4=false;S.taskMain=false;
 S.roomClues=[];S.toolFound=[];S.selected=null;S.reader=null;S.hintCursor=0;
 el('panel').scrollTop=0;
 el('scene').classList.remove('dim');
 buildScene();Sound.setRoom(S.room);refreshMusic();Sound.whisper(S.room===3?'……爸爸':'……我们都在');
}

/* ======================= 开场序列 ======================= */
function startSequence(){
 S.phase='seq';el('seq').hidden=false;
 Sound.init();Sound.crash();
 el('seqImg').style.opacity='1';el('flash').style.opacity='0';el('blackout').style.opacity='0';
 el('seqSub').textContent='';el('seqSub').classList.remove('show');
 el('seqClick').classList.remove('show');
 setTimeout(function(){el('flash').style.opacity='1';
  setTimeout(function(){el('flash').style.opacity='0';el('seqImg').style.opacity='0';el('blackout').style.opacity='1';
   Sound.tinnitus();Sound.heartbeat();},120);},550);
 setTimeout(function(){Sound.siren(4.2);},1400);
 setTimeout(function(){Sound.whisper('……醒醒');},2300);
 setTimeout(function(){el('seqSub').textContent='一阵眩晕，我这是在哪里，';el('seqSub').classList.add('show');},1800);
 setTimeout(function(){el('seqSub').textContent='一阵眩晕，我这是在哪里，\n耳边好像有什么人在说话';},4000);
 setTimeout(function(){Sound.whisper('我们都在呢');},4400);
 setTimeout(function(){S.phase='await';el('seqClick').classList.add('show');},5400);
}
function enterGame(){
 if(S.phase!=='await')return;
 S.phase='play';el('seq').hidden=true;buildScene();Sound.setRoom(0);refreshMusic();
}
el('seq').addEventListener('click',enterGame);
el('intro').addEventListener('click',function(){Sound.init();Sound.unlock();el('intro').hidden=true;startSequence();});

/* ======================= 终局 ======================= */
function showOnly(name){['intro','seq','cinematic','ending','dark'].forEach(function(s){el(s).hidden=(s!==name);});}
function setCine(item,text){el('cineItem').textContent=item;el('cineLine').textContent=text;}
function startFinale(){
 S.phase='finale';showOnly('cinematic');el('stage').style.display='none';
 /* 文字独白开始，配乐换成肖邦夜曲，一直延续到病房，片尾淡出 */
 Sound.bgm('finale');
 var i=0;
 function paper(){
  if(i<PAPER_LINES.length){setCine('相框后面',PAPER_LINES[i]);i++;setTimeout(paper,2600);}
  else setTimeout(sum,1400);
 }
 var j=0;
 function sum(){
  if(j<SUM.length){setCine('',SUM[j]);j++;setTimeout(sum,2800);}
  else setTimeout(after,3000);
 }
 function after(){
  setCine('','原来我一直都在撑。');
  setTimeout(function(){setCine('','门外有人在叫他。');setTimeout(openEnding,2400);},2800);
 }
 paper();
}
function openEnding(){
 S.phase='ending';showOnly('ending');
 el('endLine').textContent='';el('btnHand').hidden=true;
 Sound.whisper('……我们都在呢');
 setTimeout(function(){el('endLine').textContent='他慢慢睁开眼睛。';},900);
 setTimeout(function(){el('endLine').textContent='她和孩子都在。';},2900);
 setTimeout(function(){el('btnHand').hidden=false;},4400);
}
el('btnHand').addEventListener('click',function(){
 if(S.phase!=='ending')return;
 el('btnHand').hidden=true;
 el('endLine').textContent='他把手递了过去。';
 setTimeout(function(){el('endLine').textContent='那张照片被立在床头。';},2100);
 setTimeout(function(){
  S.phase='dark';showOnly('dark');Sound.fadeOutBgm();
  el('credits').hidden=false;
  el('credits').textContent='本故事纯属虚构，游戏设计BY酒吾至樽';
 },4200);
});

/* 初始化（场景在开场序列后才构建，避免提前闪出） */
if(IS_TOUCH)el('panelSub').textContent='点一下选中 → 再点目标放下；长按也能拖过去';
el('stage').style.display='flex';syncBar();
window.addEventListener('orientationchange',function(){setTimeout(syncBar,350);});
</script>
</body>
