<style>
  .wechat-bar {
    margin: 0 0 26px;
    padding: 16px 18px;
    border: 1px solid #d5f0e1;
    border-radius: 10px;
    background: #f3fbf6;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .wechat-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #07c160;
    color: #fff !important;
    text-decoration: none !important;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }
  .wechat-btn:hover { background: #06ad56; }
  .wechat-btn svg { flex: none; }
  .wechat-note { color: #6b7b71; font-size: 13px; }
</style>

{%- if site.wechat_url != blank -%}
<div class="wechat-bar">
  <a class="wechat-btn" href="{{ site.wechat_url }}" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M8.7 3C4.8 3 1.6 5.7 1.6 9c0 1.9 1 3.5 2.7 4.6l-.7 2.1 2.4-1.2c.9.3 1.8.4 2.7.4h.5a5.5 5.5 0 0 1-.2-1.5c0-3.1 3-5.6 6.8-5.6h.5C15.6 4.8 12.5 3 8.7 3Zm-2.3 4.2a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8Zm4.6 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8ZM22.4 13.4c0-2.7-2.6-4.9-5.8-4.9s-5.8 2.2-5.8 4.9 2.6 4.9 5.8 4.9c.7 0 1.4-.1 2.1-.3l1.9 1-.5-1.7c1.4-.9 2.3-2.3 2.3-3.9Zm-7.8-1.3a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Zm4 0a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z"/>
    </svg>
    前往公众号：{{ site.wechat_name | default: "我的公众号" }}
  </a>
  <span class="wechat-note">建议在微信内打开</span>
</div>
{%- endif -%}
