<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小游戏 · 位置预留</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#f4f6f9;color:#22303e;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
  .box{max-width:520px;margin:24px;padding:36px 40px;background:#fff;border:1px solid #e2e8ee;
    border-radius:14px;box-shadow:0 2px 14px rgba(20,40,60,.06);text-align:center}
  h1{font-size:22px;margin:0 0 14px;color:#10263a;line-height:1.5}
  p{margin:0;color:#6b7c8c;font-size:15px;line-height:1.8}
  .bar{width:44px;height:4px;margin:0 auto 22px;background:#ffcd5a;border-radius:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="bar"></div>
    <h1>这个位置留给站长自己的小游戏</h1>
    <p>正在准备中，敬请期待。</p>
  </div>
</body>
</html>
